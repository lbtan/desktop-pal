<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>desktop-pal</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="bubble" hidden></div>

    <div id="menu" hidden>
      <button data-action="snooze">not today 😴</button>
      <button data-action="quit">bye for now</button>
    </div>

    <div id="fx"></div>

    <div id="pal" data-mode="idle">
      <div id="zzz">z<span>z</span><span>z</span></div>
      <div id="stars">✦ ✧ ✦</div>
      <div id="flip">
        <div id="bob">
          <img class="art art-sit" src="/sit.png" alt="" draggable="false" />
          <img class="art art-sleep" src="/sit-sleep.png" alt="" draggable="false" />
          <img class="art art-walk" src="/walk.png" alt="" draggable="false" />
        </div>
      </div>
    </div>
  </body>
</html>
